# UNTESTED UNTIL FIRST TAG: registry push, keyless signing and chart publication
# require repository/package permissions to be validated by the release owner.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: Azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release and collect version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lore-hex/trcs:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
      - name: Sign image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/lore-hex/trcs@$IMAGE_DIGEST"
      - name: Package chart and binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -buildid= -X main.version=$VERSION" -o "dist/trcs-$os-$arch" ./cmd/trcs
          done
          helm package charts/confidential-inference --version "$VERSION" --app-version "$VERSION" -d dist
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/confidential-inference-$VERSION.tgz" oci://ghcr.io/lore-hex/charts
          cd dist
          sha256sum trcs-* confidential-inference-*.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/trcs-*
            dist/confidential-inference-*.tgz
            dist/SHA256SUMS
          generate_release_notes: true
