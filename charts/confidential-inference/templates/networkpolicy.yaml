{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trcs.fullname" . }}
  labels:
    {{- include "trcs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trcs.selectorLabels" . | nindent 6 }}
  # This policy is enforced by the host. It keeps third parties out; it is not
  # a control against the operator in confidential mode (docs/threat-model.md).
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.egress.cidrs }}
    - to:
        {{- range .Values.networkPolicy.egress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
  {{- end }}
{{- end }}
